<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>RAG demos</title>
<link rel="stylesheet" href="demo.css">
<style>
  html, body { height: auto; }
  body { overflow: auto; padding: 20px 24px; max-width: 1100px; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  table { border-collapse: collapse; width: 100%; margin-top: 12px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 15px; }
  th { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .04em; }
  td a { color: var(--navy); font-weight: 600; }
  .p a { display: inline-block; margin: 0 6px 4px 0; font-family: var(--mono); font-size: 13px; background: var(--navy-tint); border-radius: 4px; padding: 1px 6px; text-decoration: none; font-weight: 400; }
  .synthetic { position: static; margin-top: 14px; }
</style>
</head>
<body>
<h1>RAG Fundamentals: interactive demos</h1>
<div class="muted">For the trainer to test. Each page is sized for a 1100×600 slide iframe; clicks mirror between the trainer and student windows. Open a page twice to test the sync.</div>
<table id="t"><tr><th>#</th><th>Demo</th><th>Flow</th><th>What it shows</th><th>Presets (<code>?preset=</code>)</th></tr></table>
<script src="demo-kit.js"></script>
<script>
const D = [
  ['rag-loop', 'Flow 1.5', 'Question → retrieve → augment → generate, step by step; retrieval off brings back "licence costs".', ['off']],
  ['chunker', 'Flow 2.3', 'SOP-CH-03, the known-issues sheet or the vendor A thread, cut five ways; ✂ marks broken steps, rows, sentences.', ['sop-fixed', 'ki-fixed', 'mail']],
  ['contextual', 'Flow 2.6', 'The bare chunk vs the chunk with its context prefix, scored against three questions.', []],
  ['embedding-map', 'Flow 3.4', '2D map of every chunk, nearest neighbours for a query; draggable cosine arrows.', ['cosine']],
  ['search-lab', 'Flow 4.4 / 6', 'Real BM25, semantic, hybrid (RRF) and rerank side by side, with filters and golden-set highlights.', ['naive', 'ids', 'vendorA', 'stale']],
  ['query-transform', 'Flow 4.6', 'Rewrite, conversation, multi-query and HyDE vs the raw question.', []],
  ['grounded-answer', 'Flow 5 / 6', 'Answers per retrieved set, grounding on/off, refusals, contradictions, injection, lost in the middle.', ['none', 'contradict', 'inject', 'middle']],
  ['eval-calc', 'Flow 7', 'Recall@k, MRR, nDCG live; claim checker for faithfulness; the RAG triad.', ['claims', 'triad']],
  ['agentic', 'Flow 8', 'An agent run over find_tickets, search_docs and jira_search; indexed vs live Jira status.', ['jira']],
  ['permissions', 'Flow 9', 'Filter before the model vs "don\'t mention it"; injection defence; data residency.', ['vendor', 'leak', 'injection', 'residency']],
];
document.getElementById('t').insertAdjacentHTML('beforeend', D.map(([n, f, w, p], i) =>
  `<tr><td>${i + 1}</td><td><a href="${n}.html">${n}</a></td><td>${f}</td><td>${Demo.esc(w)}</td><td class="p">${p.map(x => `<a href="${n}.html?preset=${x}">${x}</a>`).join('') || '<span class="muted">none</span>'}</td></tr>`).join(''));
Demo.label();
</script>
</body>
</html>
